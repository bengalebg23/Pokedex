<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Full Index — National Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e7e2c8; --panel:#faf7ea; --ink:#22301f; --ink-soft:#54614c; --line:#b6ac86; --stamp:#a3392c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; padding-bottom:60px;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 0;}
  header{border-bottom:3px double var(--ink); padding-bottom:16px; margin-bottom:20px;}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:2.1rem;margin:0;}
  h1 span{font-style:italic;font-weight:600;color:var(--ink-soft);font-size:0.5em;display:block;margin-top:2px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 0 var(--line), 0 6px 14px -10px rgba(0,0,0,.25);}
  .panel h2{font-family:'Fraunces',serif;font-size:.95rem;margin:0 0 12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}

  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-size:.9rem;background:var(--panel);color:var(--ink);margin-bottom:4px;}
  .search:focus{outline:none;border-color:var(--ink);}

  .type-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
    padding:5px 11px;border-radius:20px;cursor:pointer;border:2px solid transparent;color:#fff;opacity:.55;
    transition:opacity .12s, transform .12s;
  }
  .chip:hover{opacity:.85;}
  .chip.active{opacity:1;border-color:var(--ink);transform:translateY(-1px);}

  .seg{display:flex;gap:0;border:1px solid var(--ink);border-radius:4px;overflow:hidden;width:max-content;margin-bottom:12px;}
  .seg button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:.78rem;border:none;background:transparent;
    color:var(--ink);padding:6px 14px;cursor:pointer;
  }
  .seg button.active{background:var(--ink);color:var(--panel);}

  .range-row{display:flex;flex-wrap:wrap;gap:6px;}
  .range-btn{
    font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:5px 10px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .range-btn:hover{border-color:var(--ink);color:var(--ink);}
  .range-btn.active{background:var(--ink);color:var(--panel);border-color:var(--ink);}

  .status-line{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--ink-soft);margin:6px 0 0;}
  .status-line.err{color:var(--stamp);}

  .count-line{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--ink-soft);margin-bottom:12px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .mon{
    background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;
    box-shadow:0 3px 8px -7px rgba(0,0,0,.4);
  }
  .mon .num{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--ink-soft);}
  .mon .name{font-family:'Fraunces',serif;font-weight:700;font-size:.95rem;margin:2px 0 6px;}
  .mon .types{display:flex;gap:5px;flex-wrap:wrap;}
  .mon .type-badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;color:#fff;padding:2px 7px;border-radius:10px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-family:'Fraunces',serif;font-style:italic;font-size:1.05rem;border:1px dashed var(--line);border-radius:6px;}
  .loading{text-align:center;padding:60px 20px;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Full Index<span>every known species, sortable and searchable</span></h1>
  </header>

  <div class="panel">
    <h2>Search</h2>
    <input class="search" id="searchBox" placeholder="Search by name or number…">
  </div>

  <div class="panel">
    <h2>Filter by type</h2>
    <div class="type-chips" id="typeChips"></div>
  </div>

  <div class="panel">
    <h2>Filter by number</h2>
    <div class="seg" id="rangeMode">
      <button class="active" data-mode="100">Every 100</button>
      <button data-mode="20">Every 20</button>
    </div>
    <div class="range-row" id="rangeRow"></div>
  </div>

  <div id="content">
    <div class="loading">Loading the index from the field archive…</div>
  </div>
</div>

<script>
const TYPE_COLORS = {
  normal:'#A8A77A', fire:'#EE8130', water:'#6390F0', electric:'#F7D02C', grass:'#7AC74C',
  ice:'#96D9D6', fighting:'#C22E28', poison:'#A33EA1', ground:'#E2BF65', flying:'#A98FF3',
  psychic:'#F95587', bug:'#A6B91A', rock:'#B6A136', ghost:'#735797', dragon:'#6F35FC',
  dark:'#705746', steel:'#B7B7CE', fairy:'#D685AD'
};
const MAX_DEX = 1025;
const STORAGE_KEY = 'pokedex-index-v1';

let allMons = [];
let activeTypes = new Set();
let rangeMode = '100';
let activeRange = null; // [start,end] inclusive, or null for all

function titleCase(name){
  return name.split('-').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

async function loadIndex(){
  try{
    const cached = await window.storage.get(STORAGE_KEY, false);
    if(cached && cached.value){
      allMons = JSON.parse(cached.value);
      init();
      return;
    }
  }catch(e){ /* nothing cached yet */ }

  try{
    const typeNames = Object.keys(TYPE_COLORS);
    const results = await Promise.all(typeNames.map(t =>
      fetch(`https://pokeapi.co/api/v2/type/${t}`).then(r=>r.json())
    ));
    const map = {};
    results.forEach((data, i) => {
      const typeName = typeNames[i];
      data.pokemon.forEach(entry => {
        const match = entry.pokemon.url.match(/\/pokemon\/(\d+)\//);
        if(!match) return;
        const id = parseInt(match[1], 10);
        if(id < 1 || id > MAX_DEX) return;
        if(!map[id]) map[id] = { id, name: titleCase(entry.pokemon.name), types: [] };
        map[id].types.push({ name: typeName, slot: entry.slot });
      });
    });
    allMons = Object.values(map).map(m => {
      m.types.sort((a,b)=>a.slot-b.slot);
      m.types = m.types.map(t=>t.name);
      return m;
    }).sort((a,b)=>a.id-b.id);

    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(allMons), false); }catch(e){}
    init();
  }catch(err){
    document.getElementById('content').innerHTML =
      '<div class="empty">Could not reach the Pokédex archive right now. If this keeps happening, check your network settings for this app.</div>';
    console.error(err);
  }
}

function buildRangeButtons(){
  const row = document.getElementById('rangeRow');
  row.innerHTML = '';
  const step = rangeMode === '100' ? 100 : 20;
  const allBtn = document.createElement('button');
  allBtn.className = 'range-btn' + (activeRange===null ? ' active' : '');
  allBtn.textContent = 'All';
  allBtn.addEventListener('click', ()=>{ activeRange = null; buildRangeButtons(); render(); });
  row.appendChild(allBtn);

  for(let start=1; start<=MAX_DEX; start+=step){
    const end = Math.min(start+step-1, MAX_DEX);
    const btn = document.createElement('button');
    btn.className = 'range-btn' + (activeRange && activeRange[0]===start ? ' active' : '');
    btn.textContent = `#${start}–${end}`;
    btn.addEventListener('click', ()=>{ activeRange=[start,end]; buildRangeButtons(); render(); });
    row.appendChild(btn);
  }
}

function buildTypeChips(){
  const wrap = document.getElementById('typeChips');
  wrap.innerHTML = '';
  Object.keys(TYPE_COLORS).forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.style.background = TYPE_COLORS[t];
    chip.textContent = t;
    chip.addEventListener('click', ()=>{
      if(activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
      chip.classList.toggle('active');
      render();
    });
    wrap.appendChild(chip);
  });
}

function render(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let list = allMons;

  if(activeRange) list = list.filter(m => m.id >= activeRange[0] && m.id <= activeRange[1]);
  if(activeTypes.size > 0) list = list.filter(m => m.types.some(t => activeTypes.has(t)));
  if(q) list = list.filter(m => m.name.toLowerCase().includes(q) || String(m.id).includes(q));

  const content = document.getElementById('content');
  if(list.length === 0){
    content.innerHTML = '<div class="empty">No Pokémon match those filters.</div>';
    return;
  }

  const grid = list.map(m => `
    <div class="mon">
      <div class="num">#${String(m.id).padStart(4,'0')}</div>
      <div class="name">${m.name}</div>
      <div class="types">
        ${m.types.map(t=>`<span class="type-badge" style="background:${TYPE_COLORS[t]}">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');

  content.innerHTML = `<div class="count-line">${list.length} shown</div><div class="grid">${grid}</div>`;
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('rangeMode').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  rangeMode = btn.dataset.mode;
  activeRange = null;
  document.querySelectorAll('#rangeMode button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildRangeButtons();
  render();
});

function init(){
  buildTypeChips();
  buildRangeButtons();
  render();
}

loadIndex();
</script>
</body>
</html>
